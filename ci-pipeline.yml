name: Pytest CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. Run pytest and generate an HTML report
      - name: Run pytest with HTML report
        run: pytest --html=report.html --self-contained-html

      # 2. CD Step: Automatically upload the test report as a downloadable artifact
      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always() # Ensures the report is uploaded even if some tests fail!
        with:
          name: pytest-test-report
          path: report.html