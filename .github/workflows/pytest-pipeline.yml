name: Pytest CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with HTML report
        run: pytest --html=report-${{ matrix.python-version }}.html --self-contained-html

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-python-${{ matrix.python-version }}
          path: report-${{ matrix.python-version }}.html

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Simulated Deployment Step
        run: echo "All Python versions passed! Deploying now..."
