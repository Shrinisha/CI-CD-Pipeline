name: Pytest CI Pipeline

# Trigger this pipeline on every push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest # Runs on a clean virtual Linux machine hosted by GitHub

    steps:
      # 1. Grab your code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python on the virtual machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install your project dependencies (including pytest)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run your tests with verbose output
      - name: Run pytest
        run: pytest -v
